name: CI

# Runs on every push and pull request. The publish workflow waits for this to
# pass before it builds an image, so nothing broken reaches Docker Hub.

# No `push` trigger for main: publish.yml calls this workflow for main, and
# running both produced a duplicate run that the shared concurrency group
# cancelled a second later. Pushes to any other branch still run it directly.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, gd, exif, intl, zip, mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --prefer-dist --no-interaction --no-progress

      # .env is git-ignored, as it must be, so the runner makes its own from
      # the template. The key is generated per run rather than committed
      # anywhere: a fixed test key in phpunit.xml would be a tracked secret,
      # which is exactly the habit this repository has stopped.
      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run the test suite
        run: php artisan test

  frontend:
    name: Front-end checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run types

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [php, frontend]

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, gd, exif, intl, zip, mbstring
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci --no-audit --no-fund

      # `npm run test:e2e` runs tests/e2e/prepare.mjs first, which builds
      # .env.e2e, seeds its own database and links public/storage. A base .env
      # still has to exist for any artisan call that does not pass --env=e2e.
      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The suite serves the real application, so it needs real assets.
      - run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      # WebKit is the one that matters: it is what an iPhone runs.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

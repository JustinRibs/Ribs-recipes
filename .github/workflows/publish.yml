name: Publish image

# Builds the production image and pushes it to Docker Hub.
#
# Runs only after CI passes on main, so a broken commit never becomes a
# deployable tag. Also runnable by hand from the Actions tab, and on a version
# tag (v1.2.3) for a release build.
#
# Required repository secrets:
#
#   DOCKERHUB_USERNAME  your Docker Hub account name
#   DOCKERHUB_TOKEN     a Docker Hub *access token* with Read & Write scope,
#                       created at hub.docker.com → Account settings → Personal
#                       access tokens. Never your account password: a token can
#                       be revoked on its own without changing your login.
#
# Optional repository variable:
#
#   DOCKERHUB_REPOSITORY   defaults to <username>/ribs-recipes

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish alongside latest'
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Without credentials there is nowhere to push, so the build is skipped with
  # a notice rather than failing red on every commit. Secrets cannot be read in
  # a job-level `if`, which is why this is a job of its own.
  guard:
    name: Check credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=Docker Hub not configured::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN under Settings → Secrets and variables → Actions to start publishing images."
            exit 0
          fi

          echo 'configured=true' >> "$GITHUB_OUTPUT"
          echo "Docker Hub credentials are present."

          # Report formatting problems without ever echoing a value. Docker Hub
          # answers a credential containing whitespace with "malformed HTTP
          # Authorization header", which says nothing about the actual cause and
          # is miserable to diagnose from the outside.
          if [ "$USERNAME" != "$(printf '%s' "$USERNAME" | tr -d '[:space:]')" ]; then
            echo "::warning title=DOCKERHUB_USERNAME contains whitespace::A space or newline was pasted into the secret. It is trimmed before use, but the secret is worth re-pasting."
          fi

          if [ "$TOKEN" != "$(printf '%s' "$TOKEN" | tr -d '[:space:]')" ]; then
            echo "::warning title=DOCKERHUB_TOKEN contains whitespace::A space or newline was pasted into the secret. It is trimmed before use, but the secret is worth re-pasting."
          fi

          case "$USERNAME" in
            *@*)
              echo "::warning title=DOCKERHUB_USERNAME looks like an email address::Docker Hub access tokens authenticate with the account username, not the email you sign in with."
              ;;
          esac

  # A tag build is a deliberate release of an already-tested commit; a push
  # to main has to earn its image.
  test:
    if: startsWith(github.ref, 'refs/tags/') == false
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and push
    runs-on: ubuntu-latest
    needs: [guard, test]
    # `needs` on a skipped job would skip this one too, so tag builds are
    # let through explicitly.
    if: >-
      always()
      && needs.guard.outputs.configured == 'true'
      && (needs.test.result == 'success' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - uses: actions/checkout@v7

      - name: Work out the image name
        id: image
        env:
          CONFIGURED_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          REPOSITORY="$(printf '%s' "$CONFIGURED_REPOSITORY" | tr -d '[:space:]')"

          if [ -z "$REPOSITORY" ]; then
              REPOSITORY="$(printf '%s' "$USERNAME" | tr -d '[:space:]')/ribs-recipes"
          fi

          echo "name=${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "Publishing to ${REPOSITORY}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # `docker login` directly rather than docker/login-action, so the values
      # can be trimmed in-process. A secret pasted with a trailing newline
      # produces a Basic auth header Docker Hub rejects outright, and the
      # action has no way to strip it. The token goes in on stdin, so it never
      # appears in a process list.
      - name: Log in to Docker Hub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | tr -d '[:space:]' | docker login \
            --username "$(printf '%s' "$USERNAME" | tr -d '[:space:]')" \
            --password-stdin

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Ribs Recipes
            org.opencontainers.image.description=A self-hosted recipe collection

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only. The image compiles PHP extensions, and an arm64
          # build under QEMU takes roughly twenty minutes for a machine
          # that is almost certainly x86. If the server is a Pi or an
          # Apple-silicon box, add linux/arm64 here and expect the wait.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test the image that was just pushed
        run: |
          set -euo pipefail

          IMAGE="${{ steps.image.outputs.name }}:${{ github.sha }}"
          KEY="base64:$(head -c 32 /dev/urandom | base64)"

          docker run -d --name smoke -p 8080:80 \
              -e APP_ENV=production \
              -e APP_DEBUG=false \
              -e APP_KEY="$KEY" \
              -e APP_URL=http://localhost:8080 \
              -e ADMIN_EMAIL=ci@example.test \
              "$IMAGE"

          # The entrypoint migrates and warms caches before serving.
          for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:8080/up; then break; fi
              if [ "$attempt" -eq 30 ]; then
                  echo "The container never became healthy."
                  docker logs smoke
                  exit 1
              fi
              sleep 2
          done

          check() {
              actual="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1")"
              if [ "$actual" != "$2" ]; then
                  echo "$1 returned $actual, expected $2"
                  docker logs smoke
                  exit 1
              fi
              echo "  $1 -> $actual"
          }

          check /            200
          check /recipes     200
          check /sitemap.xml 200
          # The one that matters: no Access token, so no admin.
          check /admin       403

          docker rm -f smoke

      - name: Log out
        if: always()
        run: docker logout

      - name: Summarise
        run: |
          {
              echo "### Pushed to Docker Hub"
              echo
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
              echo
              echo "Deploy on the server with:"
              echo
              echo '```bash'
              echo "cd /srv/ribs-recipes && ./scripts/backup.sh"
              echo "docker compose pull && docker compose up -d"
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

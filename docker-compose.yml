###############################################################################
# Ribs Recipes — production stack
#
#   Internet → Cloudflare → Cloudflare Tunnel → this container
#
# The tunnel runs on the host, so the container publishes one port — bound to
# 127.0.0.1, never 0.0.0.0. That distinction is the whole security posture of
# this file: the loopback bind is what keeps the site off the LAN, and
# cloudflared, running on the same host, is the only thing that can reach it.
#
# Point the tunnel's public hostname at http://localhost:${APP_PORT}.
#
#   cp .env.example .env      # fill it in (see the README)
#   docker compose up -d --build
###############################################################################

services:
  app:
    # Pulled from Docker Hub when RIBS_IMAGE names a published tag (see
    # .github/workflows/publish.yml), and built from this checkout
    # otherwise. `docker compose up -d --build` always builds locally.
    image: ${RIBS_IMAGE:-ribs-recipes:latest}
    build:
      context: .
      target: runtime
    container_name: ribs-recipes
    restart: unless-stopped

    env_file: .env
    environment:
      # The SQLite file lives on the persistent volume, not in the image.
      DB_DATABASE: /app/storage/database/database.sqlite

    volumes:
      # One volume for everything that must outlive a rebuild: the
      # database, uploaded photos, and the logs.
      - ribs-storage:/app/storage

    ports:
      # 127.0.0.1 is load-bearing. The short form ("61080:80") binds 0.0.0.0
      # and puts the site on every device on the network — which would not
      # expose the admin, since the Cloudflare token is verified rather than
      # inferred from where a request came from, but would publish the
      # collection to the LAN. Only cloudflared, on this host, should reach it.
      #
      # 61080 sits above Linux's default ephemeral range (32768–60999), so the
      # kernel will never hand it to an outbound connection and make a deploy
      # fail with "port is already allocated".
      - '127.0.0.1:${APP_PORT:-61080}:80'

    networks:
      - internal

    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', '--output', '/dev/null', 'http://127.0.0.1/up']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # A recipe site on a home server does not need much; the cap is here so
    # a runaway image conversion cannot take the whole machine with it.
    deploy:
      resources:
        limits:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # One scheduled job: sweeping up photos uploaded into an abandoned editor.
  # If this container is not running, nothing breaks.
  scheduler:
    # Deliberately the same image as the app, so the two can never drift.
    image: ${RIBS_IMAGE:-ribs-recipes:latest}
    build:
      context: .
      target: runtime
    container_name: ribs-recipes-scheduler
    restart: unless-stopped

    env_file: .env
    environment:
      DB_DATABASE: /app/storage/database/database.sqlite
      # The app container already migrated and seeded on boot.
      RUN_SEEDERS: 'false'

    volumes:
      - ribs-storage:/app/storage

    networks:
      - internal

    depends_on:
      app:
        condition: service_healthy

    command: ['php', 'artisan', 'schedule:work']

    healthcheck:
      test: ['CMD', 'php', 'artisan', 'inspire']
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 192M

    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'

volumes:
  # Holds the SQLite database, every uploaded photo, and the logs.
  # scripts/backup.sh is what protects it.
  ribs-storage:
    name: ribs-recipes-storage

networks:
  # Private link between the app and the scheduler. Nothing else reaches it;
  # traffic from outside arrives only through the published loopback port.
  internal:
    driver: bridge

; Production PHP settings for Ribs Recipes.

; --- Uploads -----------------------------------------------------------------
; A little above IMAGE_MAX_UPLOAD_KB so an oversized photo is refused by the
; application's validation, with a readable message, rather than by the server
; with an empty 413.
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 24

; --- Limits ------------------------------------------------------------------
; Image processing is the only memory-hungry operation here.
memory_limit = 256M
max_execution_time = 120

; --- Errors ------------------------------------------------------------------
; Nothing is ever rendered to the browser; Laravel logs it instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- OPcache -----------------------------------------------------------------
; The code never changes inside a running container, so revalidation is off.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.enable_file_override = 1

; --- Misc --------------------------------------------------------------------
expose_php = Off
date.timezone = UTC
